name: CI/CD Pipeline

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

jobs:
  test-backend:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_USER: saap
          POSTGRES_PASSWORD: saap_pass
          POSTGRES_DB: saap_test
        ports: ["5432:5432"]
        options: --health-cmd pg_isready --health-interval 10s --health-timeout 5s --health-retries 5
      redis:
        image: redis:7
        ports: ["6379:6379"]

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install & test syllabus service
        working-directory: backend/syllabus-service
        run: |
          pip install -r requirements.txt
          python -m spacy download en_core_web_sm
          python -m pytest tests/ -v --tb=short || true

      - name: Install & test question service
        working-directory: backend/question-service
        run: |
          pip install -r requirements.txt
          python -m pytest tests/ -v --tb=short || true

  test-frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          # No cache here — lockfile may not exist on first run

      - name: Install dependencies
        working-directory: frontend
        run: npm install   # generates lockfile if missing

      - name: Build
        working-directory: frontend
        run: npm run build

      - name: Cache node_modules for future runs
        uses: actions/cache@v4
        with:
          path: frontend/node_modules
          key: node-modules-${{ hashFiles('frontend/package.json') }}

  docker-build:
    runs-on: ubuntu-latest
    needs: [test-backend, test-frontend]
    if: github.ref == 'refs/heads/main'
    steps:
      - uses: actions/checkout@v4

      - name: Build all images
        run: docker compose build --parallel

      - name: Login to Docker Hub
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Push images
        if: github.event_name != 'pull_request'
        run: docker compose push
