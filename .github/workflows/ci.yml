name: CI/CD Pipeline

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

# Cancel in-progress runs on the same branch
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ── 1. Lint & type-check ──────────────────────────────────────
  lint:
    name: Lint & Type Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend deps
        working-directory: frontend
        run: npm ci

      - name: TypeScript type check
        working-directory: frontend
        run: npx tsc --noEmit

  # ── 2. Backend unit tests ─────────────────────────────────────
  test-backend:
    name: Backend Tests
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:15-alpine
        env:
          POSTGRES_USER: saap
          POSTGRES_PASSWORD: saap_pass
          POSTGRES_DB: saap_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      redis:
        image: redis:7-alpine
        ports: ["6379:6379"]
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"
          cache-dependency-path: |
            backend/syllabus-service/requirements.txt
            backend/question-service/requirements.txt
            backend/evaluation-service/requirements.txt

      - name: Install system deps (OCR + PDF)
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y tesseract-ocr poppler-utils libpq-dev

      - name: Install Python deps
        run: |
          pip install pytest pytest-asyncio pytest-cov
          pip install -r backend/syllabus-service/requirements.txt
          pip install -r backend/question-service/requirements.txt
          pip install -r backend/evaluation-service/requirements.txt
          python -m spacy download en_core_web_sm
          python -c "import nltk; nltk.download('stopwords'); nltk.download('punkt')"

      - name: Run unit tests
        env:
          DATABASE_URL: postgresql://saap:saap_pass@localhost:5432/saap_test
          REDIS_URL: redis://localhost:6379/0
        run: |
          python -m pytest tests/test_nlp_pipeline.py \
                           tests/test_rule_engine.py \
                           tests/test_evaluator.py \
                           tests/test_auth.py \
                           -v --tb=short \
                           --cov=backend \
                           --cov-report=xml:coverage.xml \
                           --cov-report=term-missing

      - name: Upload coverage report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: coverage-report
          path: coverage.xml

  # ── 3. Frontend build ─────────────────────────────────────────
  test-frontend:
    name: Frontend Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        working-directory: frontend
        run: npm ci

      - name: Build Next.js
        working-directory: frontend
        env:
          NEXT_PUBLIC_API_URL: http://localhost:8000
        run: npm run build

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: nextjs-build
          path: frontend/.next/
          retention-days: 1

  # ── 4. Docker build & push ────────────────────────────────────
  docker-build:
    name: Docker Build & Push
    runs-on: ubuntu-latest
    needs: [lint, test-backend, test-frontend]
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'

    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Build and push all images
        run: docker compose build --parallel
        env:
          DOCKER_BUILDKIT: 1

      - name: Push images
        run: docker compose push

  # ── 5. Security scan ──────────────────────────────────────────
  security:
    name: Security Scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Run Trivy vulnerability scan
        uses: aquasecurity/trivy-action@master
        with:
          scan-type: "fs"
          scan-ref: "."
          severity: "CRITICAL,HIGH"
          exit-code: "0"          # warn only, don't fail build
          format: "table"
