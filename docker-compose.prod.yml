# Production docker-compose — extends base compose with:
#   - Nginx reverse proxy with SSL
#   - Resource limits on all services
#   - Restart policies
#   - No exposed ports except 80/443 (everything behind Nginx)
#   - Health checks on all services
#
# Usage:
#   docker-compose -f docker-compose.yml -f docker-compose.prod.yml up -d

services:
  nginx:
    build:
      context: ./infra/nginx
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./infra/nginx/certs:/etc/nginx/certs:ro
    depends_on:
      - api-gateway
      - frontend
    restart: always
    deploy:
      resources:
        limits:
          cpus: "0.5"
          memory: 128M

  postgres:
    restart: always
    deploy:
      resources:
        limits:
          cpus: "1.0"
          memory: 512M

  redis:
    restart: always
    command: redis-server --maxmemory 256mb --maxmemory-policy allkeys-lru
    deploy:
      resources:
        limits:
          cpus: "0.5"
          memory: 256M

  api-gateway:
    restart: always
    ports: []   # remove direct port exposure — traffic goes through Nginx
    environment:
      - ENVIRONMENT=production
    deploy:
      resources:
        limits:
          cpus: "1.0"
          memory: 256M

  syllabus-service:
    restart: always
    ports: []
