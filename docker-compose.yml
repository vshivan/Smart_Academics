services:
  postgres:
    image: postgres:15-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./backend/db/init.sql:/docker-entrypoint-initdb.d/00_init.sql
      - ./backend/db/migrations/001_features.sql:/docker-entrypoint-initdb.d/01_features.sql
      - ./backend/db/migrations/002_new_features.sql:/docker-entrypoint-initdb.d/02_new_features.sql
      - ./backend/db/migrations/003_rbac_full.sql:/docker-entrypoint-initdb.d/03_rbac_full.sql
      - ./backend/db/migrations/004_otp_auth.sql:/docker-entrypoint-initdb.d/04_otp_auth.sql
      - ./backend/db/migrations/005_missing_tables.sql:/docker-entrypoint-initdb.d/05_missing_tables.sql
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  api-gateway:
    build:
      context: ./backend          # ← whole backend dir as context
      dockerfile: api-gateway/Dockerfile
    ports:
      - "8000:8000"
    env_file: .env
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - uploads:/app/uploads

  syllabus-service:
    build:
      context: ./backend
      dockerfile: syllabus-service/Dockerfile
    env_file: .env
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - uploads:/app/uploads

  knowledge-service:
    build:
      context: ./backend
      dockerfile: knowledge-service/Dockerfile
    env_file: .env
    depends_on:
      postgres:
        condition: service_healthy

  question-service:
    build:
      context: ./backend
      dockerfile: question-service/Dockerfile
    env_file: .env
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  evaluation-service:
    build:
      context: ./backend
      dockerfile: evaluation-service/Dockerfile
    env_file: .env
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - uploads:/app/uploads

  analytics-service:
    build:
      context: ./backend
      dockerfile: analytics-service/Dockerfile
    env_file: .env
    depends_on:
      postgres:
        condition: service_healthy

  management-service:
    build:
      context: ./backend
      dockerfile: management-service/Dockerfile
    env_file: .env
    depends_on:
      postgres:
        condition: service_healthy

  export-service:
    build:
      context: ./backend
      dockerfile: export-service/Dockerfile
    env_file: .env
    depends_on:
      postgres:
        condition: service_healthy

  features-service:
    build:
      context: ./backend
      dockerfile: features-service/Dockerfile
    env_file: .env
    depends_on:
      postgres:
        condition: service_healthy

  student-service:
    build:
      context: ./backend
      dockerfile: student-service/Dockerfile
    env_file: .env
    depends_on:
      postgres:
        condition: service_healthy

  notification-service:
    build:
      context: ./backend
      dockerfile: notification-service/Dockerfile
    env_file: .env
    depends_on:
      postgres:
        condition: service_healthy

  advanced-service:
    build:
      context: ./backend
      dockerfile: advanced-service/Dockerfile
    env_file: .env
    depends_on:
      postgres:
        condition: service_healthy

  celery-worker:
    build:
      context: ./backend
      dockerfile: workers/Dockerfile
    env_file: .env
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - uploads:/app/uploads
    command: celery -A tasks worker --loglevel=info --concurrency=4

  celery-beat:
    build:
      context: ./backend
      dockerfile: workers/Dockerfile
    env_file: .env
    depends_on:
      - redis
    command: celery -A tasks beat --loglevel=info

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        - NEXT_PUBLIC_API_URL=${NEXT_PUBLIC_API_URL:-http://localhost:8000}
    ports:
      - "3000:3000"
    environment:
      - NEXT_PUBLIC_API_URL=${NEXT_PUBLIC_API_URL:-http://localhost:8000}
    depends_on:
      - api-gateway

volumes:
  postgres_data:
  redis_data:
  uploads:
