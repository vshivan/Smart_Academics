[pytest]
# SAAP test configuration
asyncio_mode = auto
testpaths = tests
python_files = test_*.py
python_classes = Test*
python_functions = test_*

# Markers
markers =
    unit: Pure unit tests — no external dependencies
    integration: Integration tests — requires running Docker stack
    slow: Tests that take more than 2 seconds

# Output
addopts =
    -v
    --tb=short
    --strict-markers
    -p no:warnings

# Timeout (requires pytest-timeout)
# timeout = 30
